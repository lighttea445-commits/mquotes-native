name: Build iOS and upload to App Store Connect

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: 'CFBundleVersion. Must be higher than the last build in App Store Connect.'
        required: true
        default: '20'
      upload:
        description: 'Upload to App Store Connect after building'
        type: boolean
        default: true

jobs:
  build:
    # macOS is required — iOS cannot be compiled on Linux or Windows.
    # NOTE: GitHub bills macOS runners at 10x the Linux rate.
    runs-on: macos-15
    timeout-minutes: 150

    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Runs the patch-package postinstall, which applies
      # patches/react-native+0.81.5.patch. Without this the build is pointless.
      - name: Install dependencies
        run: npm ci

      - name: Verify React Native patch applied
        run: |
          FILE=node_modules/react-native/ReactCommon/react/nativemodule/core/platform/ios/ReactCommon/RCTTurboModule.mm
          grep -q 'RCTSwallowedTurboModuleExceptions' "$FILE" \
            || { echo "::error::patch-package did not apply the React Native patch"; exit 1; }
          echo "Patch is present."

      # App Store Connect API key. Used for provisioning profile creation and
      # for the upload. altool looks for it in ~/private_keys by convention.
      - name: Install App Store Connect API key
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_P8_BASE64 }}" | base64 --decode \
            > ~/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/private_keys/AuthKey_${ASC_KEY_ID}.p8

      # Import an EXISTING distribution certificate. Do not let
      # -allowProvisioningUpdates create one: the keychain is thrown away after
      # each run, so every build would burn one of your 3 certificate slots.
      - name: Import signing certificate
        env:
          CERT_B64: ${{ secrets.IOS_DIST_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          echo "$CERT_B64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm "$RUNNER_TEMP/cert.p12"

          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychain -d user -s "$KEYCHAIN" login.keychain

          echo "Signing identities available:"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # Generates ios/ from app.json + the config plugins (withWidgetBridgeModule,
      # @bacons/apple-targets). This is expo prebuild, not EAS Build — no Expo
      # account or service is involved.
      - name: Prebuild iOS project
        run: npx expo prebuild --platform ios --non-interactive --clean

      # eas.json's autoIncrement does not apply outside EAS, so set the build
      # number here. App Store Connect rejects a CFBundleVersion it has seen.
      # The widget extension must carry the same value as the app.
      - name: Set build number
        run: |
          BUILD_NUMBER="${{ inputs.build_number }}"
          find ios -name 'Info.plist' -not -path '*/Pods/*' | while read -r plist; do
            if /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$plist" >/dev/null 2>&1; then
              /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$plist"
              echo "Set CFBundleVersion=$BUILD_NUMBER in $plist"
            fi
          done

      - name: Archive
        run: |
          cd ios
          xcodebuild archive \
            -workspace Quotable.xcworkspace \
            -scheme Quotable \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Quotable.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Export IPA
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>HF7548K866</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Quotable.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${ASC_KEY_ID}.p8 \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          ls -lh "$RUNNER_TEMP/export"

      - name: Upload to App Store Connect
        if: ${{ inputs.upload }}
        run: |
          IPA="$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)"
          echo "Uploading $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" \
            --apiIssuer "$ASC_ISSUER_ID"

      # Kept regardless of upload, so a failed upload doesn't waste the build.
      - name: Upload IPA artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quotable-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 30
          if-no-files-found: warn

      # The .xcarchive carries the dSYMs needed to symbolicate any future crash.
      - name: Upload dSYMs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quotable-ios-dsyms
          path: ${{ runner.temp }}/Quotable.xcarchive/dSYMs
          retention-days: 30
          if-no-files-found: warn
